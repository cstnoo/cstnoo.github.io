<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Clones</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#000;--lk:#551a8b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1c;--fg:#f0f0f0;--lk:#c58af9}}
:root[data-theme="dark"]{--bg:#1c1c1c;--fg:#f0f0f0;--lk:#c58af9}

#menu{padding:8px}

#game{display:none;height:100%;flex-direction:column;align-items:center;justify-content:center}
body.g #game{display:flex}body.g #menu{display:none}
canvas{width:min(100vw,calc(88vh*4/3));height:auto;image-rendering:pixelated;background:#000}
#hint{color:#888;font:14px monospace;margin-top:8px;text-align:center}
</style></head><body>
<div id="menu"><h1>Game Clones</h1><a href="#" id="go">Undertale Genocide Boss Fight (Spoilers)</a></div>
<div id="game"><canvas id="c" width="640" height="480"></canvas>
<div id="hint">Flechas/WASD: mover · Z/Enter: aceptar · X/Shift: cancelar y moverse lento · Esc: volver al menú</div></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');x.imageSmoothingEnabled=false;
let running=false,raf,last=0,acc=0,ac;
const K={};
const MB={x:36,y:245,w:568,h:120};
const FL=["* You feel like you’re going to have a bad time.","* Sans is staring.","* You feel your sins crawling on your back.","* Sans eyes you.","* Smells like sweat.","* The air is heavy.","* Sans is breathing hard."];
const r=(a,b)=>a+Math.random()*(b-a)|0;
let st,F,hp,kr,sel,sub,tx,txi,bub,bubi,bw,bcb,turn,bones,bl,B,TB,hx,hy,hvy,onf,mv,inv,sx,sl,ia,ab,ht,ot,shake,dt,mt;
function beep(f,d,t,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const col=(gy,gap,vx)=>{bones.push({x:TB.x+TB.w,y:TB.y,w:12,h:gy-TB.y,vx,vy:0,c:'w'},{x:TB.x+TB.w,y:gy+gap,w:12,h:TB.y+TB.h-gy-gap,vx,vy:0,c:'w'})};
const rise=(gap,vy)=>{const g=r(TB.x+10,TB.x+TB.w-gap-10);bones.push({x:TB.x,y:TB.y+TB.h,w:g-TB.x,h:10,vx:0,vy,c:'w'},{x:g+gap,y:TB.y+TB.h,w:TB.x+TB.w-g-gap,h:10,vx:0,vy,c:'w'})};
const blast=(o,pos)=>bl.push({o,pos,t:0});
const TURNS=[
{s:"it’s a beautiful day outside.",b:{x:230,y:235,w:180,h:130},len:330,f:f=>{if(f%45===1)col(r(TB.y+20,TB.y+TB.h-84),64,-2.6)}},
{s:"birds are singing,\nflowers are blooming...",b:{x:240,y:235,w:160,h:130},len:380,f:f=>{if(f%70===10)blast(f%140<70?'L':'R',hy);if(f%140===80)blast('T',hx)}},
{s:"on days like these...",blue:1,b:{x:180,y:285,w:280,h:80},len:430,f:f=>{const fl=TB.y+TB.h;if(f%48===1){const h=r(22,40);bones.push({x:TB.x+TB.w,y:fl-h,w:12,h,vx:-3.2,vy:0,c:'w'})}if(f>200&&f%96===40)bones.push({x:TB.x-12,y:fl-30,w:12,h:30,vx:3.2,vy:0,c:'w'});if(f%150===100)bones.push({x:TB.x+TB.w,y:TB.y,w:12,h:20,vx:-3,vy:0,c:'w'})}},
{s:"kids like you...",b:{x:230,y:235,w:180,h:130},len:380,f:f=>{if(f%40===1)bones.push({x:TB.x+TB.w,y:TB.y,w:10,h:TB.h,vx:-2.4,vy:0,c:(f/40|0)%2?'b':'o'});if(f%80===60)bones.push({x:TB.x+TB.w,y:TB.y+TB.h-26,w:10,h:26,vx:-2.8,vy:0,c:'w'})}},
{s:"should be burning\nin hell.",b:{x:245,y:235,w:150,h:130},len:430,f:f=>{if(f%60===5)blast(['L','R','T'][r(0,3)],f%2?hy:hx);if(f%60===35)col(r(TB.y+20,TB.y+TB.h-76),56,-3)}},
{s:"...here goes.",b:{x:220,y:235,w:200,h:130},len:460,f:f=>{if(f%36===1)rise(58,-2.4);if(f%120===60){blast('L',hy);blast('R',hy)}}},
{s:"welp. last one.",b:{x:235,y:235,w:170,h:130},len:560,f:f=>{if(f%34===1)col(r(TB.y+20,TB.y+TB.h-80),60,-3.2);if(f%90===20)blast(['L','R'][f%180<90?0:1],hy);if(f%90===60)blast('T',hx);if(f>300&&f%50===25)rise(56,-2.8)}}
];
function reset(){hp=92;kr=0;sel=0;sub=null;turn=0;bones=[];bl=[];B={...MB};TB=MB;sx=0;sl=false;ia=0;shake=0;F=0;hvy=0;ot=0;
inv=[{n:"Pie",h:92,c:1},{n:"L. Hero",h:40,c:4},{n:"Noodles",h:90,c:2},{n:"Steak",h:60,c:2}];
ft("");say("ready?",()=>menu(FL[0]))}
function ft(s){tx=s;txi=0}
function menu(s){st='menu';sub=null;TB=MB;if(s!=null)ft(s)}
function say(s,cb){st='say';bub=s;bubi=0;bw=0;bcb=cb}
function endSay(){bub=null;const c=bcb;bcb=null;c&&c()}
function msg(s){st='msg';ft(s);mt=0}
function start(){running=true;reset();last=performance.now();acc=0;raf=requestAnimationFrame(loop)}
function exit(){running=false;cancelAnimationFrame(raf);document.body.className=''}
document.getElementById('go').onclick=e=>{e.preventDefault();document.body.className='g';start()};
addEventListener('keydown',e=>{if(!running)return;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();if(!K[e.code])press(e.code);K[e.code]=1});
addEventListener('keyup',e=>K[e.code]=0);
function press(c){
if(c==='Escape')return exit();
const ok=c==='KeyZ'||c==='Enter',no=c==='KeyX'||c==='ShiftLeft'||c==='ShiftRight';
const L=c==='ArrowLeft'||c==='KeyA',R=c==='ArrowRight'||c==='KeyD',U=c==='ArrowUp'||c==='KeyW',D=c==='ArrowDown'||c==='KeyS';
if(st==='say'&&ok){if(bubi<bub.length)bubi=bub.length;else endSay()}
else if((st==='dead'||st==='over')&&ok&&(dt>60||ot>90))reset();
else if(st==='msg'&&ok){if(txi<tx.length)txi=tx.length;else mt=999}
else if(st==='fight'&&ok)strike();
else if(st==='menu'){
 if(sub===null){if(L)sel=(sel+3)%4;if(R)sel=(sel+1)%4;if(ok){sub={k:sel,i:0};beep(500,.05)}}
 else{const n=sub.k===2?inv.filter(i=>i.c>0).length:1;if(U)sub.i=(sub.i+n-1)%n;if(D)sub.i=(sub.i+1)%n;if(no)sub=null;if(ok)choose()}}
}
function choose(){const k=sub.k;sub=null;
if(k===0){st='fight';ab=0}
else if(k===1)msg("* SANS 1 ATK 1 DEF\n* The easiest enemy.\n* Can only deal 1 damage.");
else if(k===2){const it=inv.filter(i=>i.c>0);if(!it.length)return menu("* No items.");const i=it[0===0?Math.min(sel2(),it.length-1):0];i.c--;hp=Math.min(92,hp+i.h);kr=0;beep(700,.15,'sine',.08);msg("* You ate the "+i.n+".\n* HP restored.")}
else{if(sl){msg("* You spared Sans.");mt=0;st='msg';setTimeout(()=>{if(running){st='over';ot=0;sl='spared'}},1500)}else msg("* You tried to spare Sans.\n* But he’s not having it.")}}
let _si=0;function sel2(){return _si}
function strike(){st='hit';ht=0;beep(300,.2,'sawtooth',.08)}
function enemy(){if(sl){return menu("* Zzz...")}
const t=TURNS[turn];TB=t.b;say(t.s,()=>{st='dodge';F=0;hx=TB.x+TB.w/2;hy=TB.y+TB.h/2;hvy=0;bones=[];bl=[]})}
function endDodge(){bones=[];bl=[];turn++;TB=MB;
if(turn>=TURNS.length)say("welp. i’m gonna\ntake a nap.",()=>{sl=true;menu("* Sans is sleeping.")});else menu(FL[turn])}
function hurt(){if(ia>0)return;ia=6;if(hp<=1)return die();hp--;kr=Math.min(kr+6,40);beep(120,.12,'square',.1);shake=5}
function die(){st='dead';dt=0;beep(80,.8,'sawtooth',.1)}
function dodge(){const t=TURNS[turn];F++;t.f(F);if(ia>0)ia--;
const k=n=>K[n[0]]||K[n[1]];
const dx=(k(['ArrowRight','KeyD'])?1:0)-(k(['ArrowLeft','KeyA'])?1:0),dy=(k(['ArrowDown','KeyS'])?1:0)-(k(['ArrowUp','KeyW'])?1:0);
const sp=(K.KeyX||K.ShiftLeft)?1:2.2;mv=!!(dx||dy);
const n=dx&&dy&&!t.blue?.707:1;hx+=dx*sp*n;
if(t.blue){const up=k(['ArrowUp','KeyW']);if(up&&onf)hvy=-4.9;if(!up&&hvy<-1.5)hvy=-1.5;hvy+=.22;hy+=hvy;onf=false;const fl=B.y+B.h-7;if(hy>=fl){hy=fl;hvy=0;onf=true}if(hy<B.y+7){hy=B.y+7;hvy=0}}
else hy+=dy*sp*n;
hx=Math.max(B.x+7,Math.min(B.x+B.w-7,hx));hy=Math.max(B.y+7,Math.min(B.y+B.h-7,hy));
for(const b of bones){b.x+=b.vx;b.y+=b.vy;
 if(hx+4>b.x&&hx-4<b.x+b.w&&hy+4>b.y&&hy-4<b.y+b.h&&(b.c==='w'||(b.c==='b'&&mv)||(b.c==='o'&&!mv)))hurt()}
bones=bones.filter(b=>b.x>TB.x-120&&b.x<TB.x+TB.w+120&&b.y>150&&b.y<500);
for(const g of bl){g.t++;if(g.t>=58&&g.t<=85){const w=g.t<62?(g.t-58)/4*30:g.t>78?(85-g.t)/7*30:30;
 if(g.t===58)beep(70,.4,'sawtooth',.12);
 const h=(g.o==='T')?Math.abs(hx-g.pos)<w/2+4:Math.abs(hy-g.pos)<w/2+4;if(h)hurt()}}
bl=bl.filter(g=>g.t<95);
if(kr>0&&F%5===0){kr--;hp=Math.max(1,hp-1)}
if(F>t.len)endDodge()}
function upd(){
for(const k in B)B[k]+=(TB[k]-B[k])*.18;
if(tx&&txi<tx.length){const o=txi|0;txi+=.5;if((txi|0)!==o&&(txi|0)%2===0)beep(450,.03,'square',.03)}
if(shake>0)shake--;
if(st==='say'){const o=bubi|0;bubi=Math.min(bub.length,bubi+.5);if((bubi|0)!==o&&(bubi|0)%2===0)beep(210,.04,'square',.05);if(bubi>=bub.length){bw++;if(bw>55)endSay()}}
else if(st==='dodge')dodge();
else if(st==='fight'){ab+=7;if(ab>B.w-40)strike()}
else if(st==='hit'){ht++;if(sl){if(ht>80){st='over';ot=0}}else{sx=Math.sin(ht/60*Math.PI)*70*(turn%2?1:-1);if(ht>60){sx=0;enemy()}}}
else if(st==='msg'){if(txi>=tx.length)mt++;if(mt>110&&sl!=='spared')enemy()}
else if(st==='over')ot++;
else if(st==='dead')dt++}
const T=(s,px,py,sz,c,al)=>{x.font=sz+"px VT323,'Courier New',monospace";x.fillStyle=c;x.textAlign=al||'left';String(s).split('\n').forEach((l,i)=>x.fillText(l,px,py+i*sz*.95))};
function heart(px,py,c){x.fillStyle=c;const m=["0110110","1111111","1111111","0111110","0011100","0001000"];for(let i=0;i<6;i++)for(let j=0;j<7;j++)if(m[i][j]==='1')x.fillRect(px-7+j*2,py-6+i*2,2,2)}
function sans(){const cx=320+sx,cy=112;x.save();if(st==='over'&&sl!==true)x.globalAlpha=Math.max(0,1-ot/90);
x.lineWidth=3;x.strokeStyle='#fff';x.fillStyle='#fff';
x.fillRect(cx-22,206,16,14);x.fillRect(cx+6,206,16,14);
x.beginPath();x.ellipse(cx-18,225,14,6,0,0,7);x.ellipse(cx+18,225,14,6,0,0,7);x.fill();
x.fillStyle='#000';x.strokeRect(cx-24,188,48,20);x.fillRect(cx-35,138,70,52);x.strokeRect(cx-35,138,70,52);
x.fillStyle='#fff';x.fillRect(cx-7,140,14,46);x.fillStyle='#000';for(let i=0;i<4;i++)x.fillRect(cx-7,148+i*9,14,2);
x.fillStyle='#000';x.strokeRect(cx-48,150,14,34);x.strokeRect(cx+34,150,14,34);
x.fillStyle='#fff';x.beginPath();x.ellipse(cx-42,188,8,7,0,0,7);x.ellipse(cx+42,188,8,7,0,0,7);x.fill();
x.fillRect(cx-35,134,70,6);
x.beginPath();x.ellipse(cx,cy,30,25,0,0,7);x.fill();
x.strokeStyle='#000';x.lineWidth=3;
if(sl){x.beginPath();x.moveTo(cx-17,cy-2);x.lineTo(cx-5,cy-2);x.moveTo(cx+5,cy-2);x.lineTo(cx+17,cy-2);x.stroke();T("z",cx+46+Math.sin(F/10)*3,100,26,'#fff');T("Z",cx+58,80,32,'#fff')}
else{x.beginPath();x.arc(cx-11,cy,6,Math.PI,2*Math.PI);x.moveTo(cx+17,cy);x.arc(cx+11,cy,6,Math.PI,2*Math.PI);x.stroke()}
x.fillStyle='#000';x.fillRect(cx-1,cy+3,3,4);x.lineWidth=2;
x.beginPath();x.arc(cx,cy+4,17,.25,Math.PI-.25);x.stroke();
for(let i=-3;i<=3;i++){x.beginPath();x.moveTo(cx+i*4.6,cy+10+Math.abs(i)*.5);x.lineTo(cx+i*4.6,cy+21-Math.abs(i)*1.6);x.stroke()}
x.restore()}
function bone(b){x.fillStyle={w:'#fff',b:'#00a2e8',o:'#ff7f27'}[b.c];x.fillRect(b.x,b.y,b.w,b.h);if(b.h>=b.w){x.fillRect(b.x-2,b.y,b.w+4,5);x.fillRect(b.x-2,b.y+b.h-5,b.w+4,5)}else{x.fillRect(b.x,b.y-2,5,b.h+4);x.fillRect(b.x+b.w-5,b.y-2,5,b.h+4)}}
function blaster(g){const ang={L:0,R:Math.PI,T:Math.PI/2}[g.o];
const px=g.o==='L'?B.x-70:g.o==='R'?B.x+B.w+70:g.pos,py=g.o==='T'?B.y-55:g.pos;
x.save();x.translate(px,py);x.rotate(ang);x.globalAlpha=Math.min(1,g.t/15);
if(g.t>=58&&g.t<=85){const w=g.t<62?(g.t-58)/4*30:g.t>78?(85-g.t)/7*30:30;x.fillStyle='#fff';x.fillRect(26,-w/2,900,w)}
const sh=g.t>40&&g.t<58?Math.sin(g.t*3)*1.5:0;x.translate(sh,0);
x.fillStyle='#fff';x.beginPath();x.ellipse(0,0,20,17,0,0,7);x.fill();x.fillRect(12,-9,18,18);
x.fillStyle='#000';x.beginPath();x.ellipse(-3,-8,4,4,0,0,7);x.ellipse(-3,8,4,4,0,0,7);x.fill();
const o=g.t>40?Math.min(6,(g.t-40)/3):0;x.fillRect(16,-1-o/2,16,2+o);
x.restore()}
function draw(){
x.setTransform(1,0,0,1,0,0);x.fillStyle='#000';x.fillRect(0,0,W=640,480);
if(st==='dead'){const a=Math.min(1,dt/30);x.globalAlpha=a;
 if(dt<40){heart(hx,hy,'#f00')}else{x.fillStyle='#f00';for(let i=0;i<8;i++){x.fillRect(hx+Math.cos(i)*(dt-40)*2,hy+Math.sin(i*1.7)*(dt-40)*2+(dt-40),4,4)}}
 if(dt>60){x.globalAlpha=1;T("GAME OVER",320,230,96,'#fff','center');T("Stay determined...",320,290,34,'#ccc','center');if(dt>100)T("[Z] Reintentar",320,350,26,'#888','center')}
 x.globalAlpha=1;return}
if(shake>0)x.translate((Math.random()-.5)*6,(Math.random()-.5)*6);
sans();
if(bub){x.fillStyle='#fff';x.beginPath();x.roundRect(390,72,220,86,18);x.fill();x.beginPath();x.moveTo(392,100);x.lineTo(368,108);x.lineTo(392,118);x.fill();T(bub.slice(0,bubi|0),404,102,24,'#000')}
if(st==='hit'){if(sl){if(ht<24){x.strokeStyle='#f33';x.lineWidth=5;x.beginPath();x.moveTo(270+ht*4,90);x.lineTo(280+ht*4,240);x.stroke()}}else T("MISS",320,68,32,'#6cf','center')}
// box
x.fillStyle='#000';x.fillRect(B.x,B.y,B.w,B.h);x.strokeStyle='#fff';x.lineWidth=5;x.strokeRect(B.x,B.y,B.w,B.h);
if(st==='dodge'||(st==='say'&&TURNS[turn]&&bub&&TB!==MB)){}
x.save();x.beginPath();x.rect(B.x,B.y,B.w,B.h);x.clip();bones.forEach(bone);x.restore();
bl.forEach(blaster);
if(st==='dodge'){if(!(ia>0&&F%2)){heart(hx,hy,TURNS[turn].blue?'#0080ff':'#f00')}}
else if(st==='say'&&TB!==MB){heart(TB.x+TB.w/2,TB.y+TB.h/2,TURNS[turn].blue?'#0080ff':'#f00')}
// box content
if(st==='menu'&&sub){const L=sub.k===0?["Sans"]:sub.k===1?["Check"]:sub.k===2?inv.filter(i=>i.c>0).map(i=>i.n+" x"+i.c):["Spare"];
 L.forEach((n,i)=>T("* "+n,B.x+52,B.y+36+i*26,26,(sub.k===3&&sl)?'#ff0':'#fff'));heart(B.x+32,B.y+28+sub.i*26,'#f00')}
else if(st==='menu'||st==='msg'||(st==='say'&&TB===MB))T(tx.slice(0,txi|0),B.x+22,B.y+38,28,'#fff');
if(st==='fight'||st==='hit'&&sl){const bx=B.x+20,bwid=B.w-40;x.fillStyle='#222';x.fillRect(bx,B.y+14,bwid,B.h-28);x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(bx,B.y+14,bwid,B.h-28);x.beginPath();x.moveTo(B.x+B.w/2,B.y+14);x.lineTo(B.x+B.w/2,B.y+B.h-14);x.stroke();
 const p=st==='fight'?ab:bwid/2;x.fillStyle=st==='hit'&&ht%4<2?'#ff0':'#fff';x.fillRect(bx+p-4,B.y+10,8,B.h-20)}
if(st==='over'){const sp=sl==='spared';T(sp?"* You spared Sans.\n* ...":"YOU WON!",B.x+B.w/2,B.y+(sp?44:52),sp?30:44,'#fff','center');if(!sp)T("You earned 0 EXP and 0 gold.",B.x+B.w/2,B.y+86,26,'#fff','center');if(ot>90)T("[Z] Jugar de nuevo",B.x+B.w/2,B.y+B.h-12,22,'#888','center')}
// stats
T("CHARA",40,392,26,'#fff');T("LV 19",140,392,26,'#fff');T("HP",212,392,18,'#fff');
x.fillStyle='#a00';x.fillRect(244,376,110,18);x.fillStyle='#ff0';x.fillRect(244,376,Math.max(0,(hp-kr)*1.2),18);
if(kr>0){x.fillStyle='#f0f';x.fillRect(244+Math.max(0,(hp-kr)*1.2),376,Math.min(kr,hp)*1.2,18)}
T("KR",364,392,18,'#fff');T(hp+" / 92",396,392,26,'#fff');
const BX=[48,186,330,466],BN=["FIGHT","ACT","ITEM","MERCY"];
BN.forEach((n,i)=>{const s=st==='menu'&&sub===null&&sel===i||(st==='menu'&&sub&&sub.k===i&&false);const c=(st==='menu'&&sel===i)?'#ff0':'#ff7f27';x.strokeStyle=c;x.lineWidth=3;x.strokeRect(BX[i],414,100,38);T(n,BX[i]+56,445,32,c,'center');if(st==='menu'&&sub===null&&sel===i)heart(BX[i]+14,433,'#f00')})}
function loop(t){if(!running)return;acc+=Math.min(100,t-last);last=t;while(acc>=16.67){upd();acc-=16.67}draw();raf=requestAnimationFrame(loop)}
let W;
</script></body></html>
